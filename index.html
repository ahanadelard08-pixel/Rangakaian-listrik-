<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulasi Rangkaian Listrik</title><link rel="stylesheet" href="style.css"></head><body><header><div><b>⚡</b><h1>Simulasi Rangkaian Listrik</h1><p>Susun, hubungkan, dan ubah nilai komponen sesuai keinginanmu!</p></div><button id="reset">↻ Reset</button></header><div class="layout"><aside class="panel"><h2>Komponen</h2><button class="add" data-type="battery">🔋 <b>Baterai</b><small>1–24 V</small></button><button class="add" data-type="resistor">▱ <b>Resistor</b><small>1–100 Ω</small></button><button class="add" data-type="lamp">💡 <b>Lampu</b><small>1–100 Ω</small></button><button class="add" data-type="switch">⏻ <b>Saklar</b><small>ON / OFF</small></button><button id="addJ" class="add">● <b>Titik Percabangan</b><small>Dapat dipindahkan</small></button><button id="clear">🗑 Hapus Semua</button></aside><main><div id="board"><svg id="wires"></svg><div id="hint">Tambahkan komponen lalu sambungkan terminal.</div><div id="toast"></div></div><div class="tools"><button id="select" class="active">↖ <b>Pilih / Pindah</b></button><button id="connect">🔗 <b>Sambung Kabel</b></button><button id="cut">✂ <b>Putus Kabel</b></button><button id="delete">🗑 <b>Hapus Komponen</b></button><button id="rotate">↻ <b>Putar 180°</b></button></div></main><aside class="right"><section class="card"><h2>Pengaturan Komponen</h2><div id="editor">Pilih komponen di papan.</div></section><section class="card"><h2>Pengaturan Baterai</h2><label>Tegangan (V)<input id="battery" type="number" min="1" max="24" value="12"></label></section><section class="card"><h2>Hasil Perhitungan</h2><div id="result">Tambahkan baterai dan komponen.</div></section><section class="card"><button id="run">▶ Jalankan</button><button id="stop">■ Berhenti</button></section></aside></div><script src="script.js"></script></body></html>
